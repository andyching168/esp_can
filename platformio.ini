[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_port = /dev/tty.usbmodem101
upload_port = /dev/tty.usbmodem101

; ============================================================
; 關鍵設定：啟用 ESP32-S3 Native USB (USB-OTG)
; ============================================================
build_flags = 
    ; 1. 將 USB 模式設定為 Native USB (不是 UART Bridge)
    -D ARDUINO_USB_MODE=1
    ; 2. 啟用開機時的 USB CDC (讓 Serial.print 可以透過 USB 傳輸)
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ============================================================
; 程式庫依賴 (Library Dependencies)
; ============================================================
lib_deps = 
    ; 用於驅動 MCP2515 CAN 模組
    coryjfowler/mcp_can @ ^1.5.0